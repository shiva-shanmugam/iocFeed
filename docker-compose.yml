name: ioc-platform
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ioc}
      POSTGRES_USER: ${POSTGRES_USER:-ioc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ioc} -d ${POSTGRES_DB:-ioc}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    command: ["/app/entrypoint.sh"]
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ioc:change-me@db:5432/ioc}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: ./backend
    command: ["python", "-m", "ingest.scheduler"]
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ioc:change-me@db:5432/ioc}
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports: ["5173:80"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:

